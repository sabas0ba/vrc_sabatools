name: Unity

# Compiles the package inside a real Unity Editor and runs EditMode tests.
# This is what closes the gap the offline `Verify` workflow cannot reach: the
# UnityEditor API signatures that .github/verify/UnityEditorStub.cs only
# asserts by hand, and the collectors that need a live editor
# (EditorUtility.CollectDependencies, the SerializedObject walk, prefab status).
#
# Runs Unity-backed regression tests when a Unity licence is available in
# repository secrets. Without a licence, the Unity regression jobs are skipped with
# a notice; the non-Unity Verify workflow remains the required regression gate.
#
#   UNITY_EMAIL     Unity ID email
#   UNITY_PASSWORD  Unity ID password
#   UNITY_LICENSE   contents of Unity_v20XX.ulf  (Personal licence)
#   UNITY_SERIAL    serial instead of UNITY_LICENSE  (Plus / Pro)
#
# See https://game.ci/docs/github/activation for how to obtain the .ulf file.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    name: Detect Unity licence
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect Unity licence
        id: detect
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity regression skipped::UNITY_LICENSE and UNITY_SERIAL are not configured. The Unity regression jobs will be skipped; non-Unity regression tests still run in Verify."
          fi

  editmode:
    name: Core Unity EditMode regression tests
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The GameCI editor image is large; the default runner does not have room
      # for it alongside the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Assemble the CI project
        run: |
          set -euo pipefail
          cp -r .github/verify/CIProject CIProject
          # An embedded package under Packages/ is picked up without a manifest
          # entry, and resolves against the working tree rather than a release.
          cp -r Packages/io.github.sabas0ba.sabatools.core CIProject/Packages/io.github.sabas0ba.sabatools.core
          find CIProject -maxdepth 3 -not -path '*/.*' | sort

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: CIProject/Library
          key: unity-library-${{ hashFiles('Packages/io.github.sabas0ba.sabatools.core/**', '.github/verify/CIProject/**') }}
          restore-keys: |
            unity-library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: CIProject
          testMode: EditMode
          artifactsPath: CIProject/TestResults
          checkName: Unity EditMode results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-editmode-results
          path: CIProject/TestResults
          if-no-files-found: ignore

  # The SDK-facing modules, against the real VRChat SDK.
  #
  # A separate job per lane, and a separate project per lane: com.vrchat.avatars
  # and com.vrchat.worlds are not meant to share a project, which is the reason
  # sabatools.avatar and sabatools.world are separate packages. The SDK is
  # fetched by URL and SHA256 from .github/verify/vrchat/packages.<lane>.lock.
  sdk:
    name: VRChat SDK regression tests (${{ matrix.lane }})
    needs: licence
    if: needs.licence.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [avatars, worlds]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      # Fetches the pinned SDK (in a container) and lays out the project.
      # A missing or wrong hash fails here rather than in Unity.
      - name: Assemble the ${{ matrix.lane }} project
        run: ./.github/verify/vrchat/assemble.sh ${{ matrix.lane }} "$GITHUB_WORKSPACE/build/${{ matrix.lane }}Project"

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ matrix.lane }}Project/Library
          key: unity-library-${{ matrix.lane }}-${{ hashFiles('Packages/**', '.github/verify/vrchat/**') }}
          restore-keys: |
            unity-library-${{ matrix.lane }}-

      # Filtered to this repository's assemblies: the SDK ships test assemblies
      # of its own, and some of them fail for reasons unrelated to these
      # packages, which would make the exit status meaningless.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: build/${{ matrix.lane }}Project
          testMode: EditMode
          artifactsPath: build/${{ matrix.lane }}Project/TestResults
          checkName: VRChat ${{ matrix.lane }} EditMode results
          customParameters: -testFilter SabaTools.Inspect.*.SdkTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrchat-${{ matrix.lane }}-editmode-results
          path: build/${{ matrix.lane }}Project/TestResults
          if-no-files-found: ignore
