name: Unity

# Compiles the package inside a real Unity Editor and runs EditMode tests.
# This is what closes the gap the offline `Verify` workflow cannot reach: the
# UnityEditor API signatures that .github/verify/UnityEditorStub.cs only
# asserts by hand, and the collectors that need a live editor
# (EditorUtility.CollectDependencies, the SerializedObject walk, prefab status).
#
# Requires a Unity licence in repository secrets. Without one every step after
# the gate is skipped and the job reports success, so forks and contributors
# without access are not blocked.
#
#   UNITY_EMAIL     Unity ID email
#   UNITY_PASSWORD  Unity ID password
#   UNITY_LICENSE   contents of Unity_v20XX.ulf  (Personal licence)
#   UNITY_SERIAL    serial instead of UNITY_LICENSE  (Plus / Pro)
#
# See https://game.ci/docs/github/activation for how to obtain the .ulf file.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Compile and EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for a Unity licence
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity job skipped::UNITY_LICENSE / UNITY_SERIAL is not set, so the real Unity compile was skipped. See .github/workflows/unity.yml."
          fi

      # The GameCI editor image is large; the default runner does not have room
      # for it alongside the preinstalled toolchains.
      - name: Free disk space
        if: steps.licence.outputs.available == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Assemble the CI project
        if: steps.licence.outputs.available == 'true'
        run: |
          set -euo pipefail
          cp -r .github/verify/CIProject CIProject
          # An embedded package under Packages/ is picked up without a manifest
          # entry, and resolves against the working tree rather than a release.
          cp -r Packages/io.github.sabas0ba.sabatools.inspect CIProject/Packages/io.github.sabas0ba.sabatools.inspect
          find CIProject -maxdepth 3 -not -path '*/.*' | sort

      - name: Cache Unity Library
        if: steps.licence.outputs.available == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: CIProject/Library
          key: unity-library-${{ hashFiles('Packages/io.github.sabas0ba.sabatools.inspect/**', '.github/verify/CIProject/**') }}
          restore-keys: |
            unity-library-

      - name: Run EditMode tests
        if: steps.licence.outputs.available == 'true'
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: CIProject
          testMode: EditMode
          artifactsPath: CIProject/TestResults
          checkName: Unity EditMode results

      - name: Upload test results
        if: always() && steps.licence.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-editmode-results
          path: CIProject/TestResults
          if-no-files-found: ignore
