name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      # The reference assemblies never change for a given pin, so a cache hit
      # makes every step after the fetch network-independent.
      - name: Cache reference assemblies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .verify/refs
          key: unity-refs-2021.3.33-netfx-1.0.3

      # No setup-python step: every Python script here runs in the pinned
      # container that .github/scripts/run.sh starts, so the runner's
      # interpreter never takes part. Docker is preinstalled on GitHub-hosted
      # runners.
      - name: Verify package
        run: ./.github/verify/verify.sh
