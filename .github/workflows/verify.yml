name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-unity-regression:
    name: Non-Unity regression tests
    runs-on: ubuntu-latest
    env:
      VERIFY_IMAGE: localhost/vrc-sabatools-dev:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the pinned Nix development image
        run: docker build --pull --tag "$VERIFY_IMAGE" .

      # Links and executes the production Editor/Core sources directly. This
      # job has no Unity, NuGet package or network dependency after the image
      # build has materialised the flake.lock development profile.
      - name: Run Editor/Core regression tests
        run: >-
          docker run --rm --network=none "$VERIFY_IMAGE"
          dotnet run
          --project .github/verify/offline/SabaTools.Inspect.OfflineTests.csproj
          --configuration Release

  compile:
    name: Compile and validate packages
    runs-on: ubuntu-latest
    env:
      VERIFY_IMAGE: localhost/vrc-sabatools-dev:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the pinned Nix development image
        run: docker build --pull --tag "$VERIFY_IMAGE" .

      # The reference assemblies never change for a given pin, so a cache hit
      # makes every step after the fetch network-independent.
      - name: Cache reference assemblies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .verify/refs
          key: unity-refs-2021.3.33-netfx-1.0.3

      - name: Prepare bind-mounted verification directories
        run: mkdir -p .verify/refs .verify/out

      - name: Compile and run .NET checks in the Nix container
        env:
          VERIFY_SKIP_OFFLINE_TESTS: "1"
          VERIFY_SKIP_CONTAINER_CHECKS: "1"
        run: >-
          docker run --rm
          --env VERIFY_SKIP_OFFLINE_TESTS
          --env VERIFY_SKIP_CONTAINER_CHECKS
          --volume "$GITHUB_WORKSPACE/.verify/refs:/workspace/.verify/refs"
          "$VERIFY_IMAGE"
          ./.github/verify/verify.sh

      # No setup-python step: every Python script runs in the digest-pinned
      # container started by run.sh. Docker is the only host dependency.
      - name: Render documentation and validate manifests
        run: bash ./.github/verify/verify-content.sh
