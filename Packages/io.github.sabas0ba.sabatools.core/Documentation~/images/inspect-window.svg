<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SabaTools Inspectウィンドウの操作箇所</title>
  <desc id="desc">TargetとMode、検査ボタン、結果概要、Statistics、Textures、Findingsを番号で示した説明図</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#17213a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", "Noto Sans JP", sans-serif; fill: #e7eaf0; }
      .small { font-size: 13px; }
      .label { font-size: 14px; fill: #c8ced9; }
      .value { font-size: 14px; fill: #f4f6fa; }
      .heading { font-size: 15px; font-weight: 700; }
      .muted { fill: #9ba6b8; }
      .callout-title { font-size: 16px; font-weight: 700; fill: #f4f7ff; }
      .callout-body { font-size: 13px; fill: #aebbd1; }
      .line { stroke: #68d7e2; stroke-width: 2; fill: none; opacity: .85; }
      .number { fill: #68d7e2; }
      .number-text { font-size: 14px; font-weight: 800; fill: #07121c; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#background)"/>
  <g opacity=".16" stroke="#8096d9">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200M0 720H1200"/>
    <path d="M80 0V760M160 0V760M240 0V760M320 0V760M400 0V760M480 0V760M560 0V760M640 0V760M720 0V760M800 0V760M880 0V760M960 0V760M1040 0V760M1120 0V760"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="34" y="28" width="716" height="704" rx="8" fill="#292d34" stroke="#68717f"/>
    <rect x="34" y="28" width="716" height="38" rx="8" fill="#1d2026"/>
    <rect x="34" y="58" width="716" height="8" fill="#1d2026"/>
    <text class="ui heading" x="56" y="53">SabaTools Inspect</text>
    <circle cx="718" cy="47" r="7" fill="#59616d"/>
  </g>

  <g class="ui">
    <text class="label" x="58" y="95">Target</text>
    <rect x="142" y="76" width="576" height="28" rx="3" fill="#353a43" stroke="#555e6b"/>
    <rect x="151" y="81" width="18" height="18" rx="2" fill="#5674ce"/>
    <text class="value" x="178" y="95">AvatarRoot</text>
    <circle cx="702" cy="90" r="8" fill="none" stroke="#8d97a6"/>

    <text class="label" x="58" y="130">Mode</text>
    <rect x="142" y="111" width="576" height="28" rx="3" fill="#353a43" stroke="#555e6b"/>
    <text class="value" x="153" y="130">Auto</text>
    <path d="M700 122l6 6 6-6" fill="none" stroke="#b9c0cb" stroke-width="2"/>

    <rect x="58" y="151" width="323" height="32" rx="4" fill="#3a404a" stroke="#646d7a"/>
    <rect x="393" y="151" width="325" height="32" rx="4" fill="#3a404a" stroke="#646d7a"/>
    <text class="value" text-anchor="middle" x="219" y="172">Scan Target</text>
    <text class="value" text-anchor="middle" x="555" y="172">Scan Active Scene</text>

    <text class="heading" x="58" y="215">AvatarRoot — Avatar — 1 error(s), 2 warning(s)</text>
    <rect x="58" y="229" width="323" height="32" rx="4" fill="#3a404a" stroke="#646d7a"/>
    <rect x="393" y="229" width="325" height="32" rx="4" fill="#3a404a" stroke="#646d7a"/>
    <text class="value" text-anchor="middle" x="219" y="250">Copy Markdown</text>
    <text class="value" text-anchor="middle" x="555" y="250">Export Markdown...</text>

    <rect x="50" y="279" width="684" height="433" rx="4" fill="#252930" stroke="#424955"/>
    <path d="M64 300l6 6 6-6" fill="none" stroke="#b9c0cb" stroke-width="2"/>
    <text class="heading" x="84" y="307">Statistics</text>

    <text class="heading" x="72" y="340">Objects</text>
    <text class="label" x="82" y="366">GameObjects</text><text class="value" x="688" y="366" text-anchor="end">42</text>
    <text class="heading" x="72" y="398">Geometry</text>
    <text class="label" x="82" y="424">Triangles</text><text class="value" x="688" y="424" text-anchor="end">68,240</text>
    <text class="label" x="82" y="450">Material slots</text><text class="value" x="688" y="450" text-anchor="end">12</text>

    <path d="M64 482l6 6 6-6" fill="none" stroke="#b9c0cb" stroke-width="2"/>
    <text class="heading" x="84" y="489">Textures (3)</text>
    <text class="label" x="82" y="520">Body_Main (2048×2048, BC7)</text><text class="value" x="616" y="520" text-anchor="end">5.33 MiB</text>
    <rect x="632" y="501" width="56" height="26" rx="3" fill="#3a404a" stroke="#646d7a"/>
    <text class="small" text-anchor="middle" x="660" y="519">Ping</text>

    <path d="M64 552l6 6 6-6" fill="none" stroke="#b9c0cb" stroke-width="2"/>
    <text class="heading" x="84" y="559">Findings (3)</text>
    <rect x="72" y="576" width="552" height="42" rx="4" fill="#5a3035" stroke="#a95b63"/>
    <text class="small" x="84" y="594">[Avatar] View Position is left at the origin.</text>
    <text class="small muted" x="84" y="610">AvatarRoot</text>
    <rect x="632" y="584" width="56" height="26" rx="3" fill="#3a404a" stroke="#646d7a"/>
    <text class="small" text-anchor="middle" x="660" y="602">Ping</text>
    <rect x="72" y="626" width="552" height="42" rx="4" fill="#594a29" stroke="#a98a46"/>
    <text class="small" x="84" y="651">[Performance] Triangles are rated Poor.</text>
    <rect x="632" y="634" width="56" height="26" rx="3" fill="#3a404a" stroke="#646d7a"/>
    <text class="small" text-anchor="middle" x="660" y="652">Ping</text>
    <rect x="72" y="676" width="616" height="27" rx="4" fill="#2d4557" stroke="#47758f"/>
    <text class="small" x="84" y="695">[Texture] Memory values are estimates.</text>
  </g>

  <g class="ui">
    <path class="line" d="M718 105H790V91H824"/>
    <circle class="number" cx="718" cy="105" r="13"/><text class="number-text" x="718" y="105">1</text>
    <text class="callout-title" x="842" y="88">対象と検査Mode</text>
    <text class="callout-body" x="842" y="109">Avatar root等を指定し、Autoまたは</text>
    <text class="callout-body" x="842" y="127">明示的なrule setを選択します。</text>

    <path class="line" d="M718 168H790V191H824"/>
    <circle class="number" cx="718" cy="168" r="13"/><text class="number-text" x="718" y="168">2</text>
    <text class="callout-title" x="842" y="188">検査範囲</text>
    <text class="callout-body" x="842" y="209">Target以下、またはActive Sceneの</text>
    <text class="callout-body" x="842" y="227">全rootを読み取り専用で走査します。</text>

    <path class="line" d="M718 235H790V291H824"/>
    <circle class="number" cx="718" cy="235" r="13"/><text class="number-text" x="718" y="235">3</text>
    <text class="callout-title" x="842" y="288">概要とMarkdown</text>
    <text class="callout-body" x="842" y="309">ModeとError／Warning数を確認し、</text>
    <text class="callout-body" x="842" y="327">同じreportをコピーまたは保存します。</text>

    <path class="line" d="M718 374H790V391H824"/>
    <circle class="number" cx="718" cy="374" r="13"/><text class="number-text" x="718" y="374">4</text>
    <text class="callout-title" x="842" y="388">Statistics</text>
    <text class="callout-body" x="842" y="409">Geometry、Rendering、Component等を</text>
    <text class="callout-body" x="842" y="427">group単位で確認します。</text>

    <path class="line" d="M688 515H790V491H824"/>
    <circle class="number" cx="688" cy="515" r="13"/><text class="number-text" x="688" y="515">5</text>
    <text class="callout-title" x="842" y="488">Textures</text>
    <text class="callout-body" x="842" y="509">解像度、format、推定memoryを表示。</text>
    <text class="callout-body" x="842" y="527">PingでProject上のassetを探します。</text>

    <path class="line" d="M688 612H790V609H824"/>
    <circle class="number" cx="688" cy="612" r="13"/><text class="number-text" x="688" y="612">6</text>
    <text class="callout-title" x="842" y="606">Findings</text>
    <text class="callout-body" x="842" y="627">severity、category、message、pathを表示。</text>
    <text class="callout-body" x="842" y="645">位置が分かる項目はPingできます。</text>

    <text class="small muted" x="824" y="705">実装準拠の説明図。標準controlの外観は</text>
    <text class="small muted" x="824" y="723">Unity theme／versionにより変わります。</text>
  </g>
</svg>
